# Secret-scan config consumed by scripts/lib/secret-scan.py during publish.
#
# Loaded via yaml.safe_load. Severity values: critical (blocks publish),
# warning (logs, non-blocking unless --strict).

forbidden_patterns:
  aws_account_id:
    regex: '\b195026230833\b'
    severity: critical
    description: Internal staging/prod AWS account ID

  internal_gitlab:
    regex: 'gitlab\.aws\.dev'
    severity: critical
    description: Internal GitLab hostname

  internal_amazon:
    regex: 'code\.amazon\.com'
    severity: critical
    description: Internal Amazon code-review hostname

  internal_awsi:
    regex: '\b[a-z0-9-]+\.awsi\.aws\.dev'
    severity: critical
    description: Amazon-internal awsi.aws.dev hostname

  slack_internal:
    regex: 'slack\.com/archives/[A-Z0-9]+'
    severity: critical
    description: Internal Slack archive link

  aws_access_key:
    regex: '\b(AKIA|ASIA)[A-Z0-9]{16}\b'
    severity: critical
    description: AWS access key ID prefix

  cognito_user_pool_id:
    regex: '\bus-(?:east|west)-[12]_[A-Za-z0-9]{8,}\b'
    severity: critical
    description: Hardcoded Cognito User Pool ID (any region) — should be runtime config

  cognito_hosted_ui_domain:
    regex: '\b[a-z0-9-]+\.auth\.us-(?:east|west)-[12]\.amazoncognito\.com\b'
    severity: critical
    description: Hardcoded Cognito hosted-UI domain — should be runtime config

  internal_email:
    regex: '\b[a-zA-Z0-9._-]+@amazon\.com\b'
    severity: warning
    description: Internal Amazon email address (warning — author commits typically catch these)

  # OEM1 brand canaries — migrated from forbidden_strings 2026-06-02 (spec A1.4.2) to use word boundaries
  oem1_ford:
    regex: '\bford\b'
    severity: critical
    description: "OEM1 brand canary (Ford) — word-bounded to avoid Wallingford/afford false positives"

  oem1_fordpro:
    regex: '\bfordpro\b'
    severity: critical
    description: "OEM1 brand canary (FordPro) — word-bounded"

  oem1_lincoln:
    regex: '\blincoln\b'
    severity: critical
    description: "OEM1 brand canary (Lincoln) — word-bounded to avoid Lincoln Park/Nebraska false positives"

  oem1_autonomic:
    regex: '\bautonomic\b'
    severity: critical
    description: "OEM1 brand canary (Autonomic) — word-bounded"

  oem1_fcsfleet:
    regex: '\bfcsfleet\b'
    severity: critical
    description: "OEM1 brand canary (FCSFleet) — word-bounded"

  oem1_tmc_external:
    regex: '\btmc-external\b'
    severity: critical
    description: "OEM1 brand canary (tmc-external) — word-bounded"

  oem1_tmc_branded:
    regex: '(?<![A-Za-z0-9])TMC(?![A-Za-z])'
    severity: critical
    description: "OEM1 vendor platform name (TMC) — added 2026-06-02 per Group A2 security-review Cycle 3; regex updated Cycle 4 to match underscore-bounded compound identifiers (TMC_TEST_VEHICLE etc.)"

  oem1_redeef:
    regex: '\bredeef\b'
    severity: critical
    description: "OEM1 vendor service codename (redeef) — added 2026-06-02 per Group A2 security-review Cycle 3"

forbidden_strings:
  - "Mahindra"
  - "mahindra"
  - "M&M"
  - "m_and_m"
  - "givenand"
  - "Michelin"
  - "michelin"
  - "RMIbbLFSpKnxrkoEqrs8jmuzHoVR4Klzp9AZpSfBYJna"
  # Internal staging-gate canaries (added 2026-06-01 per spec
  # 2026-06-01-cms-staging-midway-gate Cycle 2 sanitization). Prevent
  # future drift of internal terminology into public-mirror'd content.
  - "Midway"
  - "midway"
  - "MIDWAY"
  - "CFSigner"
  - "CloudFrontSigner"
  - "cfsigner"
  - "midwayKeyGroupId"
  # OEM1 brand canaries (added 2026-06-01 per spec
  # 2026-06-01-cms-oem1-transform-manifest-staging-e2e A1.2; broad-token entries
  # migrated to forbidden_patterns 2026-06-02 per A1.4.2 to avoid substring
  # false positives. Long-form domains and UUIDs remain here.)
  - "autonomic.ai"
  - "feed.autonomic.ai"
  - "fcsfleet.onmicrosoft.com"
  - "f9c1c210-682c-4ec5-a73b-d12d8fa143f6"
  - "1d0b95d3-c64f-4a2b-8816-d855412062c0"

scan_exclude:
  # Binaries and assets
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.svg"
  - "*.ico"
  - "*.woff*"
  - "*.ttf"
  - "*.mp4"
  - "*.zip"
  # Vendored / third-party
  - "**/node_modules/**"
  - "**/.yarn/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/.git/**"
  # Per-developer state
  - "**/.venv/**"
  - "**/cdk.out/**"
  - "cdk.context.json"
  # FWE simulator static-config (added 2026-06-08 per backlog row
  # 'static-config operator leak'). Tracked file but contains operator
  # absolute paths (persistencyPath / certificateFilename / privateKeyFilename)
  # baked at IoT-cert mint time. Already excluded from public mirror via
  # `.publish-exclude` ("Generated/per-developer simulation config"); this
  # path-level scan_exclude silences forbidden_string:<username> canary noise
  # during full-tree scanner runs (e.g. the recall-data brand leak audit
  # 2026-06-08 surfaced 3 hits here). Long-term fix is untrack-and-templatize
  # via *.example pattern; deferred per user 2026-06-08 (not worth the effort
  # for audit-noise cleanup).
  # Pattern matches both when scanning from repo root and from
  # services/simulation/fwe_config/ (mirrors typed_data_decoder.py convention).
  - "services/simulation/fwe_config/static-config.json"
  - "static-config.json"
  # The scanner self-references for documentation
  - "scripts/lib/secret-scan.py"
  - "scripts/lib/test_secret_scan.py"
  - ".publish-secrets-scan.yml"
  # Rename pipeline necessarily contains brand-canary literals (TMC, redeef, etc.)
  # in its substitution-rule comments and regex patterns. Excluded by design.
  - "scripts/rename-oem1-protos.py"
  # B1.2 type-URL adapter dispatch dict contains vendor type-URL literals by design.
  # The production OEM1 server sends type.googleapis.com/autonomic.ext.* URLs which
  # must appear as dict keys. Excluded per decisions.md A2.3 carry-forward Suggestion #2.
  # Pattern matches both when scanning from repo root and from services/connectors/oem1/.
  - "services/connectors/oem1/typed_data_decoder.py"
  - "typed_data_decoder.py"
  # C1.11.5: Files that legitimately reference `from autonomic.ext.*` after Fix
  # Group C1.11 restored proto package directives for gRPC wire-path correctness.
  # Same rationale as typed_data_decoder.py above: vendor namespace is required
  # at the import-statement level; canary-scrubbing the file would force a
  # functional regression. Spec: 2026-06-01-cms-oem1-transform-manifest-staging-e2e
  - "services/connectors/oem1/mock_server.py"
  - "mock_server.py"
  - "services/connectors/oem1/tests/test_mock_server.py"
  - "tests/test_mock_server.py"
  - "services/connectors/oem1/tests/test_integration_against_mock.py"
  - "tests/test_integration_against_mock.py"
  # C1.11.5 follow-on: connector event-decode test legitimately references
  # autonomic.ext.* type_url constants as structural test contracts. Same
  # rationale as test_mock_server.py / test_integration_against_mock.py above.
  # Added per spec 2026-06-09-cms-oem1-dtc-engine-light-pipeline Fix Group 1.1.
  - "services/connectors/oem1/tests/test_connector_event_decode.py"
  - "tests/test_connector_event_decode.py"
  # test_connector_kafka_auto_register.py imports `autonomic.ext.*` proto SDK
  # packages (unavoidable vendor package names, same as siblings above).
  # Added 2026-06-12 pre-v0.2.3-publish — sibling test added after the v0.2.0
  # scan_exclude pass and missed; same rationale as the OEM1 connector tests above.
  - "services/connectors/oem1/tests/test_connector_kafka_auto_register.py"
  - "tests/test_connector_kafka_auto_register.py"
  # F2.2.1: OEMTelemetryProcessor matcher + assetId Java tests legitimately
  # reference type.googleapis.com/autonomic.ext.event.Event TYPE_URL constants
  # as structural-test-contract protocol identifiers; canary-scrubbing would
  # force a functional regression. Same rationale as test_connector_event_decode.py.
  # Added per spec 2026-06-09-cms-oem1-dtc-engine-light-pipeline Fix Group 2.2.
  - "modules/flink/src/test/java/com/cms/telemetry/OEMTelemetryProcessorMatcherTest.java"
  - "modules/flink/src/test/java/com/cms/telemetry/OEMTelemetryProcessorAssetIdTest.java"
  # 2026-06-11 (v0.2.0 publish prep): the OEM1 transform manifest references
  # the canonical protobuf type URLs (`type.googleapis.com/autonomic.ext.*`)
  # as match predicates and source_event_type_url fields. These are public
  # protobuf type identifiers (not credentials or PII), and removing them
  # would break the runtime match logic in OEMTelemetryProcessor. Same
  # rationale as typed_data_decoder.py / mock_server.py / Java test classes.
  # Spec: 2026-06-09-cms-oem1-dtc-engine-light-pipeline (Path ε event_mappings)
  - "services/data_processing/manifests/oem1-transform.json"
  - "manifests/oem1-transform.json"
  # 2026-06-11 (v0.2.0 publish prep, batch 2): more test files and the
  # manifest README that necessarily reference autonomic.ext.* protobuf
  # URLs / vendor brand names. Same rationale as the entries above.
  - "services/connectors/oem1/tests/test_kafka_emit_shape.py"
  - "tests/test_kafka_emit_shape.py"
  - "services/connectors/oem1/tests/test_seed_vehicles.py"
  - "tests/test_seed_vehicles.py"
  - "services/data_processing/manifests/README.md"
  - "manifests/README.md"
  # 2026-06-11 (v0.2.0 publish prep, batch 3): broader OEM1 connector + admin
  # Lambda + UI + Java test + design-doc surface that legitimately references
  # vendor protocol identifiers (`autonomic.ext.*` URIs, OEM brand names) as
  # part of the connector implementation. These cannot be scrubbed without
  # functional regression. Same rationale as scan_excludes above for
  # typed_data_decoder.py, mock_server.py, etc.
  - "services/connectors/oem1/connector.py"
  - "services/connectors/oem1/main.py"
  - "services/connectors/oem1/streaming_consumer.py"
  - "services/connectors/oem1/mock_rest_server.py"
  - "services/connectors/oem1/kafka_producer.py"
  - "services/connectors/oem1/Dockerfile"
  - "services/connectors/oem1/README.md"
  - "services/connectors/oem1/admin_oem1_command/handler.py"
  - "services/connectors/oem1/admin_add_vehicle/tests/test_handler.py"
  - "services/connectors/oem1/admin_preflight/tests/test_handler.py"
  - "modules/flink/src/test/java/com/cms/telemetry/OEMTelemetryProcessorOEM1ManifestFixTest.java"
  - "modules/flink/src/test/java/com/cms/telemetry/OEMTelemetryProcessorWayBSparseTest.java"
  - "modules/flink/src/test/java/com/cms/telemetry/OEMTelemetryProcessorEventHandlingTest.java"
  - "deployment/stacks/connector_stack.py"
  - "deployment/stacks/ui_stack.py"
  - "deployment/scripts/test_drain_stale_fwe_agents.sh"
  - "docs/DEPLOYMENT.md"
  # Files that necessarily contain canary patterns by design
  - ".gitignore"               # gitignore patterns include literal account IDs to prevent tracking
  - ".publish-exclude"         # exclude patterns include literal "mahindra-*" wildcard
  - "CODE_OF_CONDUCT.md"       # public AWS Open Source contact email
  - "CONTRIBUTING.md"          # public AWS Open Source contact email
  # NHTSA recall data (added 2026-06-08 per issue
  # 2026-06-08-cms-recall-data-scan-exclude — surfaced by case-insensitivity
  # fix `890ad58` 2026-06-04 which exposed pre-existing brand attributions
  # in legitimate public-domain government regulatory data).
  #
  # NHTSA recall payloads are US National Highway Traffic Safety Administration
  # public-domain output. Brand strings here ("manufacturer": "Ford Motor
  # Company", "make": "Ford" / "Lincoln") are factual references to the
  # regulated entity in a federal recall record — they are NOT internal
  # vendor disclosure. Same exclusion class as `typed_data_decoder.py` and
  # `mock_server.py` above (vendor-namespace-by-design): the data must hold
  # real brand names to function. Recall-feature files SHIP to the public
  # mirror so customers using the accelerator with real NHTSA data continue
  # to work; the scanner skips them.
  #
  # The two `nhtsaRecallData.ts` and `nhtsa_fleet_recalls.json` files are
  # auto-regenerated by `services/recall-integration/nhtsa_recall_poller.py`;
  # the next non-empty NHTSA response will repopulate thousands of brand
  # references. Exclusion must hold across regenerations.
  - "services/recall-integration/nhtsa_fleet_recalls.json"
  - "services/recall-integration/nhtsaRecallData.ts"
  - "modules/cms_ui/source/frontend/src/components/recall-warranty/nhtsaRecallData.ts"
  - "nhtsa_fleet_recalls.json"
  - "nhtsaRecallData.ts"
  # Synthetic fleet seed/simulator/UI demo data (added 2026-06-08 per issue
  # 2026-06-08-cms-recall-data-scan-exclude § (B) audit — surfaced by the
  # same case-insensitivity fix). These files reference real-world vehicle
  # make names (Ford alongside Toyota / Honda / Chevrolet / Rivian / Tesla
  # / Mercedes / Ram / Dodge) as a representative cross-section of the US
  # fleet market, used to make synthetic demo fleets and UI mocks look
  # realistic. Vehicle make ↔ model coupling is intrinsic (F-150 is a Ford
  # model; rebranding the make without the model would produce incoherent
  # fake-model strings). Same exclusion class as the NHTSA block above:
  # by-design real-world brand references in synthetic / runtime-data
  # contexts, not internal vendor disclosure.
  #
  # Carries forward the OEM1 spec A1.2 "runtime-data exemption" precedent
  # for vehicle-make tuples (`make: "Ford"` etc. in seed data) and A1.4.3
  # precedent for dealer-chain UI text (`"AutoNation Ford — Houston"`),
  # both of which originally relied on the scanner being case-sensitive.
  # After the case-insensitivity fix `890ad58`, these need explicit
  # path-level exemption to preserve the documented design decision.
  - "deployment/scripts/seed_vehicle_lifecycle.py"
  - "services/simulation/enhanced_historical_data_injector.py"
  - "modules/cms_ui/source/frontend/src/components/iot/OTAManagement.tsx"
  - "modules/cms_ui/source/frontend/src/components/vehicles/vehicle-detail/ScheduleServiceModal.tsx"
  # Test fixtures intentionally containing canary strings
  - "**/test_secret_scan.py"
  - "**/tests/fixtures/**"
