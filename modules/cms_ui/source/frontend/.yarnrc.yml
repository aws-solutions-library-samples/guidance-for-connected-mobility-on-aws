# Yarn version is pinned via package.json "packageManager": "yarn@4.6.0".
# corepack (enabled in CI + expected locally) resolves that field and downloads
# the pinned yarn. Do NOT re-introduce `yarnPath: .yarn/releases/...` — the
# publish flow strips `.yarn/` from the public mirror (see .publish-exclude),
# and a yarnPath pointing at a stripped binary breaks the mirror's lint.yml.
# See issues/2026-09-28-mirror-yarn-lint-red/.

enableGlobalCache: true

httpTimeout: 300000

nodeLinker: node-modules
