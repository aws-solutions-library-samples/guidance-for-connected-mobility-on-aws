syntax = "proto3";

package autonomic.ext.command.custom;

option go_package = "github.com/autonomic-ai/external-protos/src/main/proto/autonomic/ext/command/custom";
option java_package = "com.autonomic.ext.command.custom";
option java_outer_classname = "CustomProto";
option java_multiple_files = true;
option cc_enable_arenas = true;
option objc_class_prefix = "AUT";

import "google/protobuf/any.proto";

// A user-defined command that the TMC is agnostic to.
message CustomRequest {

  message CommandDefinitionMetadata {
    // The name of the command.
    string name = 1;

    // The <major.minor.patch> version of the command, represented as a string.
    string version = 2;

    // UUID that refers to the globally unique user-defined command definition associated with this
    // command
    string id = 3;
  }

  CommandDefinitionMetadata command_definition_metadata = 1;
}
