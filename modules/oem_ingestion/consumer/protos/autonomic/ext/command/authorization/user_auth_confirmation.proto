syntax = "proto3";

package autonomic.ext.command.authorization;

option go_package = "github.com/autonomic-ai/external-protos/src/main/proto/autonomic/ext/command/authorization";
option java_package = "com.autonomic.ext.command.authorization";
option java_outer_classname = "UserAuthConfirmationProto";
option java_multiple_files = true;
option cc_enable_arenas = true;
option objc_class_prefix = "AUT";

// A request to confirm user authorization
message UserAuthConfirmationRequest {
    oneof AuthorizationSettings {
        string username = 1;
        bytes qr_code = 2;
    }
}

