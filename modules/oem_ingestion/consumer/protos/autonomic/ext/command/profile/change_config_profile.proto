syntax = "proto3";

package autonomic.ext.command.profile;

option go_package = "github.com/autonomic-ai/external-protos/src/main/proto/autonomic/ext/command/profile";
option java_package = "com.autonomic.ext.command.profile";
option java_outer_classname = "ChangeConfigProfileProto";
option java_multiple_files = true;
option cc_enable_arenas = true;
option objc_class_prefix = "AUT";

// A request to change the config profile on a device
message ChangeConfigProfileRequest {
    // Opaque, OEM-provided device profile name to change
    string profile_name  = 1;
}
