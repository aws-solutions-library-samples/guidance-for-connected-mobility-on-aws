syntax = "proto3";

package autonomic.ext.connectivity.enumerations.connectivityRegion;

option go_package = "github.com/autonomic-ai/external-protos/src/main/proto/autonomic/ext/connectivity/enumerations";
option java_package = "com.autonomic.ext.connectivity.enumerations";
option java_outer_classname = "ConnectivityRegionProto";
option java_multiple_files = true;

option cc_enable_arenas = true;

option objc_class_prefix = "AUT";

enum ConnectivityRegion {
  UNKNOWN = 0;
  NA = 1; // North America
  EU = 2; // Europe
  CN = 3; // China
  RW = 4; // Rest-of-world
}
