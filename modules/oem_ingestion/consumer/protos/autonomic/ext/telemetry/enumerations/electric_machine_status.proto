syntax = "proto3";

package autonomic.ext.telemetry.enumerations.electricMachineStatus;

option go_package = "github.com/autonomic-ai/external-protos/src/main/proto/autonomic/ext/telemetry/enumerations";
option java_package = "com.autonomic.ext.telemetry.enumerations";
option java_outer_classname = "ElectricMachineStatusProto";
option java_multiple_files = true;

option cc_enable_arenas = true;

option objc_class_prefix = "AUT";

enum ElectricMachineStatus {
  option deprecated = true;
  UNKNOWN = 0;
  POWER_CONSUMPTION = 1;
  POWER_GENERATION = 2;
  DEACTIVATION_STATE = 3;
  READINESS_STATE = 4;
  NO_DATA_EXISTS = 5;
}
