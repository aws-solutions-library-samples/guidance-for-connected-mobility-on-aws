syntax = "proto3";

package autonomic.ext.telemetry;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/autonomic-ai/external-protos/src/main/proto/autonomic/ext/telemetry";
option java_package = "com.autonomic.ext.telemetry";
option java_outer_classname = "IngestAuditProto";
option java_multiple_files = true;

option cc_enable_arenas = true;

option objc_class_prefix = "AUT";

message Rule {
  int32 rule_id = 1;
  int32 rule_version = 2;
}

message IngestAudit {
  repeated string denied_fields = 1;
  repeated string permitted_fields = 2;
  repeated Rule rules = 3;
}

