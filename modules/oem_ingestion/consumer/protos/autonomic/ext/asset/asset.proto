syntax = "proto3";

package autonomic.ext.asset;

option go_package = "github.com/autonomic-ai/external-protos/src/main/proto/autonomic/ext/asset";
option java_package = "com.autonomic.ext.asset";
option java_outer_classname = "AssetProto";
option java_multiple_files = true;

option cc_enable_arenas = true;

option objc_class_prefix = "AUT";

message AssetChangeEvent {
  enum EventType {
    CREATED = 0;
    UPDATED = 1;
    DELETED = 2;
  }

  EventType type = 1;

  AssetDetails asset_details = 2;
}

message AssetDetails {
  enum AssetType {
    VEHICLE = 0;
    DEVICE = 1;
  }

  // The UUID of the asset.
  string id = 1;

  // The broad category of asset type.
  AssetType type = 2;

  // The properties of the asset.
  map<string, string> properties = 3;

  // The reported properties of the asset.
  map<string, string> reported_properties = 4;

  // The tags of the asset.
  map<string, string> tags = 5;

  // vin of the bounded vehicle gets populated for device events
  string vin = 6;

  // esn of the bounded device gets populated for vehicle events
  string esn = 7;

  // specific device type like assets/devices/tcu, assets/devices/ecg, etc only for device events
  string device_type = 8;

  // account id of the asset
  string account_id = 9;

}
